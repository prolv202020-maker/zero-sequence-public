name: Public publication boundary
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject author-only source files in public website
        run: node scripts/audit-public-boundary.mjs
      - name: Verify all local website links and assets
        run: node scripts/audit-site-links.mjs
      - name: Ensure first-time visitors receive reader scripts
        run: node scripts/ensure-chapter-bootstrap.mjs --check
      - name: Test reading flow and independent chapter unlocks
        run: node scripts/test-reading-flow.mjs
      - name: Verify equipment, items and materials render chapter-gated CG images
        run: node scripts/test-inline-archive-artworks.mjs
      - name: Test full-site CG V2 gallery, species links, reading gates and source backlinks
        run: node scripts/test-cg-integration-v2.mjs
      - name: Validate CG V3 exact paragraph anchors, unlocked equipment filters and preservation
        run: node scripts/test-cg-scenes-v3.mjs
      - name: Test CG V4 reading controls and locked-only filtering
        run: node scripts/test-cg-reader-v4.mjs
      - name: Validate four new V5 artwork files, alternate views and spoiler-safe catalog links
        run: node scripts/test-cg-supplemental-v5.mjs
      - name: Test upgraded homepage, spoiler-safe search and reader navigation
        run: node scripts/test-site-relaunch.mjs
      - name: Verify 13-volume audiobook center, 130 MP3 links, mobile listening and BGM safety
        run: node scripts/test-audiobook-center.mjs
      - name: Audit V7 all 131 original MP3 hashes, sizes and unmodified playback URLs
        run: node scripts/test-v7-audio-integrity.mjs
      - name: Validate third-arc original illustrations, existing covers and spoiler-safe per-part unlocks
        run: node scripts/test-third-gallery.mjs
      - name: Protect seven approved character portraits and audit visual identity references
        run: node scripts/test-character-visual-identity.mjs
      - name: Validate 12 immersive chapter illustrations, original prose and spoiler-safe gallery navigation
        run: node scripts/test-immersive-illustrations.mjs
