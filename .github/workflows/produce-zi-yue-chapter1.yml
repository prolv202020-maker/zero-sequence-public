name: Produce Zi Yue v4 Chapter 1 master audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/produce-zi-yue-chapter1.yml'
jobs:
  produce-chapter-001:
    if: github.repository == 'prolv202020-maker/zero-sequence-public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prevent duplicate paid generation
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feat/zi-yue-v4-first-chapter-audio-20261107'
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo 'Audio generation already completed: refusing another paid call.' >&2
            exit 1
          fi
      - name: Validate production script against the complete published chapter without paying
        run: |
          python scripts/test_zi_yue_production.py
          python scripts/elevenlabs_narrate.py \
            --input tts/production/volume_01_chapter_001_zi_yue_v4.txt \
            --voice-preset zi-yue --model eleven_v4 --profile expressive --dry-run
      - name: Produce approved single Zi Yue voice with scene emotion
        run: |
          python scripts/elevenlabs_narrate.py \
            --input tts/production/volume_01_chapter_001_zi_yue_v4.txt \
            --voice-preset zi-yue --model eleven_v4 --profile expressive
      - name: Verify and stage complete MP3
        shell: bash
        run: |
          set -euo pipefail
          AUDIO='tts-output/volume_01_chapter_001_zi_yue_v4/volume_01_chapter_001_zi_yue_v4.mp3'
          test -s "$AUDIO"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tts-output/volume_01_chapter_001_zi_yue_v4/volume_01_chapter_001_zi_yue_v4.mp3")
          b=p.read_bytes()
          assert b[:3]==b"ID3" and 4_000_000<len(b)<30_000_000, "Unexpected or incomplete output"
          print("Verified new Zi Yue MP3",len(b),"bytes")
          PY
          mkdir -p assets/audio/audiobook/part-01/volume-01
          cp "$AUDIO" assets/audio/audiobook/part-01/volume-01/chapter-001.mp3
      - name: Save generated MP3 as recoverable artifact
        uses: actions/upload-artifact@v4
        with:
          name: zi-yue-v4-first-chapter-master
          path: tts-output/volume_01_chapter_001_zi_yue_v4/
          retention-days: 30
          if-no-files-found: error
      - name: Create isolated branch for website review and publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c feat/zi-yue-v4-first-chapter-audio-20261107
          git add assets/audio/audiobook/part-01/volume-01/chapter-001.mp3
          git commit -m 'Replace first chapter audiobook binary with approved Zi Yue v4 recording'
          git push --set-upstream origin feat/zi-yue-v4-first-chapter-audio-20261107
