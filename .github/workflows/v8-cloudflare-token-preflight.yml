name: V8 Cloudflare Analytics token read-only preflight
on:
  push:
    branches: [feature/v8-public-traffic-counter-prep-20261110]
    paths: ['scripts/probe-v8-cloudflare-token.mjs','.github/workflows/v8-cloudflare-token-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check Cloudflare API token without disclosing it
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: node scripts/probe-v8-cloudflare-token.mjs
