name: V6 Chromium desktop and mobile reading acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright browser test tooling
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run desktop and emulated mobile full-site acceptance
        run: node scripts/test-v6-browser.mjs
      - name: Archive V6 browser report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-browser-acceptance-${{ github.run_id }}
          path: v6-browser-results/
          if-no-files-found: warn
          retention-days: 14
