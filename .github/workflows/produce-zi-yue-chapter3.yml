name: Produce Zi Yue v4 Chapter 3 master audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/produce-zi-yue-chapter3.yml'
jobs:
  produce-chapter-003:
    if: github.repository == 'prolv202020-maker/zero-sequence-public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prevent a duplicate paid recording
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feat/zi-yue-v4-chapter-003-audio-20261107'
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo 'Chapter 3 was generated previously; no duplicate charge.' >&2
            exit 1
          fi
      - name: Confirm all published paragraphs and free dry run
        run: |
          python scripts/test_zi_yue_chapter3.py
          python scripts/elevenlabs_narrate.py \
            --input tts/production/volume_01_chapter_003_zi_yue_v4.txt \
            --voice-preset zi-yue --model eleven_v4 --profile expressive --dry-run
      - name: Generate complete Chapter 3 using one approved Zi Yue v4 call
        run: |
          python scripts/elevenlabs_narrate.py \
            --input tts/production/volume_01_chapter_003_zi_yue_v4.txt \
            --voice-preset zi-yue --model eleven_v4 --profile expressive
      - name: Verify MP3 and copy into review-ready location
        shell: bash
        run: |
          set -euo pipefail
          AUDIO='tts-output/volume_01_chapter_003_zi_yue_v4/volume_01_chapter_003_zi_yue_v4.mp3'
          test -s "$AUDIO"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tts-output/volume_01_chapter_003_zi_yue_v4/volume_01_chapter_003_zi_yue_v4.mp3")
          b=p.read_bytes()
          assert b[:3]==b"ID3" and 700_000<len(b)<20_000_000, "Audio invalid or incomplete"
          print("Verified Zi Yue v4 Chapter 3:",len(b),"bytes")
          PY
          mkdir -p assets/audio/audiobook/part-01/volume-01
          cp "$AUDIO" assets/audio/audiobook/part-01/volume-01/chapter-003.mp3
      - name: Preserve master MP3 as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zi-yue-v4-chapter-003-master
          path: tts-output/volume_01_chapter_003_zi_yue_v4/
          if-no-files-found: error
          retention-days: 30
      - name: Push audio to review branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c feat/zi-yue-v4-chapter-003-audio-20261107
          git add assets/audio/audiobook/part-01/volume-01/chapter-003.mp3
          git commit -m 'Record the full Zi Yue Eleven v4 Chapter 3'
          git push --set-upstream origin feat/zi-yue-v4-chapter-003-audio-20261107
