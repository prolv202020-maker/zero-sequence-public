name: Staged release readiness
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check latest volume has ten complete chapters and synced publication
        run: node scripts/check-staged-release.mjs
      - name: Verify all 30 volume chapter catalogs have the same layout, scripts, and reading-state safeguards
        run: node scripts/test-unified-volume-catalogs.mjs
      - name: Verify all released people, monsters, weapons, equipment, skills and three independent unlock tracks
        run: node scripts/test-reader-codex.mjs
      - name: Audit released chapter timeline and published site functionality
        run: |
          node scripts/audit-published-timeline.mjs
          node scripts/test-phase1-integration.mjs
      - name: Verify visual codex sources, spoiler gates and graceful image fallback
        run: node scripts/test-visual-codex.mjs

      - name: Validate ElevenLabs narration bridge without API usage
        run: python3 scripts/test_elevenlabs_narrate.py
      - name: Validate Zi Yue audiobook script matches the published chapter without credit usage
        run: python3 scripts/test_zi_yue_production.py
      - name: Verify published first chapter audiobook player and original MP3
        run: node scripts/test-audiobook-publication.mjs
      - name: Verify 13-volume audiobook center, 130 MP3 links, mobile listening and BGM safety
        run: node scripts/test-audiobook-center.mjs
      - name: Validate third-arc original illustrations, existing covers and spoiler-safe per-part unlocks
        run: node scripts/test-third-gallery.mjs
      - name: Protect seven approved character portraits and audit visual identity references
        run: node scripts/test-character-visual-identity.mjs
      - name: Verify Zi Yue voice production script for chapter 2 without paid API requests
        run: python3 scripts/test_zi_yue_chapter2.py
      - name: Verify Zi Yue voice production script for chapter 3 without paid API requests
        run: python3 scripts/test_zi_yue_chapter3.py
      - name: Verify Zi Yue voice production script for chapter 4 without paid API requests
        run: python3 scripts/test_zi_yue_chapter4.py
      - name: Verify Zi Yue voice production script for chapter 5 without paid API requests
        run: python3 scripts/test_zi_yue_chapter5.py
      - name: Verify Zi Yue voice production script for chapter 6 without paid API requests
        run: python3 scripts/test_zi_yue_chapter6.py
      - name: Verify Zi Yue voice production script for chapter 7 without paid API requests
        run: python3 scripts/test_zi_yue_chapter7.py
      - name: Verify Zi Yue voice production script for chapter 8 without paid API requests
        run: python3 scripts/test_zi_yue_chapter8.py
      - name: Verify Zi Yue voice production script for chapter 9 without paid API requests
        run: python3 scripts/test_zi_yue_chapter9.py
      - name: Verify Zi Yue voice production script for chapter 10 without paid API requests
        run: python3 scripts/test_zi_yue_chapter10.py
      - name: Verify Zi Yue voice prologue script without paid API requests
        run: python3 scripts/test_zi_yue_prologue.py
