name: Staged release readiness
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check latest volume has ten complete chapters and synced publication
        run: node scripts/check-staged-release.mjs
