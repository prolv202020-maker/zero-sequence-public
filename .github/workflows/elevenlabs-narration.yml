name: ElevenLabs Chinese Female Narration
on:
  push:
    branches: [main]
    paths:
      - 'tts/inbox/*.txt'
  workflow_dispatch:
    inputs:
      file:
        description: 'Article, e.g. tts/samples/volume_01_chapter_001_audition.txt'
        required: true
        type: string
      dry_run:
        description: 'Only count credits; do not generate audio'
        type: boolean
        default: true
jobs:
  narrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      MANUAL_FILE: ${{ inputs.file }}
      DRY_RUN: ${{ inputs.dry_run }}
      BEFORE: ${{ github.event.before }}
      AFTER: ${{ github.sha }}
      TRIGGER: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select one safe article
        id: article
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRIGGER" == "workflow_dispatch" ]]; then
            ARTICLE="$MANUAL_FILE"
          else
            mapfile -t ARTICLES < <(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'tts/inbox/*.txt')
            if (( ${#ARTICLES[@]} != 1 )); then
              echo 'Submit exactly one new or modified chapter per merge to protect ElevenLabs credits.' >&2
              exit 1
            fi
            ARTICLE="${ARTICLES[0]}"
          fi
          if [[ "$TRIGGER" == "workflow_dispatch" ]]; then
            REGEX='^tts/(inbox|samples)/[A-Za-z0-9_-]+\\.txt
            echo 'Invalid article path: tts/inbox/chapter_001.txt is valid.' >&2
            exit 1
          fi
          echo "article=$ARTICLE" >> "$GITHUB_OUTPUT"
      - name: Generate Chinese female narration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRIGGER" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            python scripts/elevenlabs_narrate.py --input '${{ steps.article.outputs.article }}' --dry-run
          else
            python scripts/elevenlabs_narrate.py --input '${{ steps.article.outputs.article }}'
          fi
      - name: Download MP3 as artifact
        if: success() && (github.event_name == 'push' || inputs.dry_run == false)
        uses: actions/upload-artifact@v4
        with:
          name: chinese-female-mp3-${{ github.run_number }}
          path: tts-output/
          if-no-files-found: error
          retention-days: 30

          else
            REGEX='^tts/inbox/[A-Za-z0-9_-]+\\.txt
            echo 'Invalid article path: tts/inbox/chapter_001.txt is valid.' >&2
            exit 1
          fi
          echo "article=$ARTICLE" >> "$GITHUB_OUTPUT"
      - name: Generate Chinese female narration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRIGGER" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            python scripts/elevenlabs_narrate.py --input '${{ steps.article.outputs.article }}' --dry-run
          else
            python scripts/elevenlabs_narrate.py --input '${{ steps.article.outputs.article }}'
          fi
      - name: Download MP3 as artifact
        if: success() && (github.event_name == 'push' || inputs.dry_run == false)
        uses: actions/upload-artifact@v4
        with:
          name: chinese-female-mp3-${{ github.run_number }}
          path: tts-output/
          if-no-files-found: error
          retention-days: 30

          fi
          if [[ ! "$ARTICLE" =~ $REGEX ]]; then
            echo 'Invalid article path: tts/inbox/chapter_001.txt is valid.' >&2
            exit 1
          fi
          echo "article=$ARTICLE" >> "$GITHUB_OUTPUT"
      - name: Generate Chinese female narration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRIGGER" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            python scripts/elevenlabs_narrate.py --input '${{ steps.article.outputs.article }}' --dry-run
          else
            python scripts/elevenlabs_narrate.py --input '${{ steps.article.outputs.article }}'
          fi
      - name: Download MP3 as artifact
        if: success() && (github.event_name == 'push' || inputs.dry_run == false)
        uses: actions/upload-artifact@v4
        with:
          name: chinese-female-mp3-${{ github.run_number }}
          path: tts-output/
          if-no-files-found: error
          retention-days: 30
