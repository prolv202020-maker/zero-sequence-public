name: ElevenLabs Chinese Female Narration
on:
  push:
    branches: [main]
    paths:
      - 'tts/inbox/*.txt'
  workflow_dispatch:
    inputs:
      file:
        description: 'Article, e.g. tts/samples/volume_01_chapter_001_audition.txt'
        required: true
        type: string
      voice_profile:
        description: 'Voice delivery: natural (clear, steady) or expressive (subtle emotional shifts)'
        type: choice
        default: natural
        options:
          - natural
          - expressive
      voice_preset:
        description: "Voice: existing Amy or new Zi Yue trial (not automatically published)"
        type: choice
        default: existing
        options:
          - existing
          - zi-yue
      tts_model:
        description: "Model: existing multilingual v2 or emotional Eleven v4"
        type: choice
        default: eleven_multilingual_v2
        options:
          - eleven_multilingual_v2
          - eleven_v4
      dry_run:
        description: 'Only count credits; do not generate audio'
        type: boolean
        default: true
jobs:
  narrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      MANUAL_FILE: ${{ inputs.file }}
      DRY_RUN: ${{ inputs.dry_run }}
      VOICE_PROFILE: ${{ inputs.voice_profile }}
      VOICE_PRESET: ${{ inputs.voice_preset }}
      TTS_MODEL: ${{ inputs.tts_model }}
      BEFORE: ${{ github.event.before }}
      AFTER: ${{ github.sha }}
      TRIGGER: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select one safe article
        id: article
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRIGGER" == "workflow_dispatch" ]]; then
            ARTICLE="$MANUAL_FILE"
          else
            mapfile -t ARTICLES < <(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'tts/inbox/*.txt')
            if (( ${#ARTICLES[@]} != 1 )); then
              echo 'Submit exactly one new or modified chapter per merge to protect ElevenLabs credits.' >&2
              exit 1
            fi
            ARTICLE="${ARTICLES[0]}"
          fi
          if [[ "$TRIGGER" == "workflow_dispatch" ]]; then
            REGEX='^tts/(inbox|samples|auditions)/[A-Za-z0-9_-]+\.txt$'
          else
            REGEX='^tts/inbox/[A-Za-z0-9_-]+\.txt$'
          fi
          if [[ ! "$ARTICLE" =~ $REGEX ]]; then
            echo 'Invalid article path: tts/inbox/chapter_001.txt is valid.' >&2
            exit 1
          fi
          echo "article=$ARTICLE" >> "$GITHUB_OUTPUT"
      - name: Install MP3 merger for seamless chapter download
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Generate Chinese female narration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRIGGER" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            python scripts/elevenlabs_narrate.py --input '${{ steps.article.outputs.article }}' --profile "${VOICE_PROFILE:-natural}" --voice-preset "${VOICE_PRESET:-existing}" --model "${TTS_MODEL:-eleven_multilingual_v2}" --dry-run
          else
            python scripts/elevenlabs_narrate.py --input '${{ steps.article.outputs.article }}' --profile "${VOICE_PROFILE:-natural}" --voice-preset "${VOICE_PRESET:-existing}" --model "${TTS_MODEL:-eleven_multilingual_v2}"
          fi
      - name: Download MP3 as artifact
        if: success() && (github.event_name == 'push' || inputs.dry_run == false)
        uses: actions/upload-artifact@v4
        with:
          name: chinese-female-mp3-${{ github.run_number }}
          path: tts-output/
          if-no-files-found: error
          retention-days: 30
