name: Produce Zi Yue v4 Volume 02 Full Audiobook (Chapters 2 to 10)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/produce-zi-yue-volume02-batch.yml'
jobs:
  produce-volume02:
    if: github.repository == 'prolv202020-maker/zero-sequence-public'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard against a second paid batch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feat/zi-yue-v4-volume02-audio-20261108'
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo 'Batch already started. Refusing duplicate paid generation.' >&2
            exit 1
          fi
      - name: Validate all published chapter texts before any paid requests
        run: |
          python scripts/produce_zi_yue_volume02_batch.py --preflight
      - name: Generate, validate, and stage nine chapter MP3s sequentially
        run: |
          python -u scripts/produce_zi_yue_volume02_batch.py --produce
