name: V8 RUM deployed beacon tag cross-check
on:
  push:
    branches: [feature/v8-public-traffic-counter-prep-20261110]
    paths: ['scripts/probe-v8-rum-tag.mjs','.github/workflows/v8-rum-tag-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts/probe-v8-rum-tag.mjs
            assets/js/visitor-analytics.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Web Analytics property tags without logging identifiers
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: node scripts/probe-v8-rum-tag.mjs
