name: V8 RUM zero-results scope diagnostic (read only)
on:
  push:
    branches: [feature/v8-public-traffic-counter-prep-20261110]
    paths: ['scripts/diagnose-v8-cloudflare-rum.mjs','.github/workflows/v8-cloudflare-rum-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts/diagnose-v8-cloudflare-rum.mjs
            assets/js/visitor-analytics.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare site tag host and path filters without exporting raw traffic
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: node scripts/diagnose-v8-cloudflare-rum.mjs
