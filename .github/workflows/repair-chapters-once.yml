name: One-time chapter bootstrap repair
on:
  push:
    branches: [main]
    paths:
      - scripts/ensure-chapter-bootstrap.mjs
permissions:
  contents: write
jobs:
  patch-chapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add missing bootstrap script to all chapter pages
        run: node scripts/ensure-chapter-bootstrap.mjs
      - name: Verify local links and public boundaries
        run: |
          node scripts/audit-site-links.mjs
          node scripts/audit-public-boundary.mjs
      - name: Commit repaired chapters if needed
        run: |
          if git diff --quiet -- chapters/; then
            echo "All chapters already have first-visit bootstrap."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/
          git commit -m "Ensure first-visit reader bootstrap for chapter pages"
          git push origin HEAD:main
