name: Volume 33 Complete Integrity
on:
  pull_request:
    paths:
      - 'chapters/volume-33/**'
      - 'volumes/volume-33.html'
      - 'scripts/test-volume33-complete.mjs'
      - '.github/workflows/volume33-complete-integrity.yml'
      - 'assets/js/**'
      - 'assets/data/search-index.json'
      - 'parts/part-04.html'
      - 'index.html'
  push:
    branches: [release/volume-33-complete-20261110]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify all chapters, navigation and spoiler boundaries
        run: node scripts/test-volume33-complete.mjs
